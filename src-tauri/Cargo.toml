[package]
name = "dm-workbench"
version = "0.1.0"
description = "Private Dungeon Master desktop workbench for D&D 5e"
authors = ["DM Workbench"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dm_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
